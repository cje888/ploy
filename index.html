const svg = (k,s) => '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'+ICON[k]+'</svg>';

/* links */

const CONTACTS = [
  { name:"WhatsApp", url:ME.whatsapp ? "https://wa.me/" + ME.whatsapp : "", cls:"i-wa", icon:"wa" },
  { name:"Call me",  url:ME.phone ? "tel:" + ME.phone : "",                 cls:"i-phone", icon:"phone" },
  { name:"Email me", url:ME.email ? "mailto:" + ME.email : "",              cls:"i-mail", icon:"mail", logo:"gm" }
];
function row(s){
  let a;
  if (s.url){
    a = document.createElement("a");
    a.className = "soc"; a.href = s.url; a.rel = "noopener";
  } else {
    a = document.createElement("button");
    a.type = "button"; a.className = "soc preview";
    a.addEventListener("click", showPreview);
  }
  const logo = LOGO[s.logo || s.icon];
  const ic = logo ? '<img src="'+logo+'" alt="">' : (ICON[s.icon] ? svg(s.icon,24) : s.icon);
  a.innerHTML = '<span class="ico3d '+s.cls+(logo?' has-img':'')+'">'+ic+'</span><span class="t"><b></b></span>';
  if (s.iconOnly){ a.querySelector(".t").remove(); a.setAttribute("aria-label", s.name); a.title = s.name; }
  else a.querySelector(".t b").textContent = s.name;
  return a;
}
const contacts = document.getElementById("contacts");
CONTACTS.forEach(s => contacts.appendChild(row(s)));

const socials = document.getElementById("socials");
ME.socials.forEach(s => socials.appendChild(row(Object.assign({iconOnly:true}, s))));


/* live Thailand time and working status */
function tick(){
  const now = new Date();
  const t = new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Bangkok",hour:"numeric",minute:"2-digit",hour12:true}).format(now);
  const h = +new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Bangkok",hour:"numeric",hour12:false}).format(now);
  void 0; // = t.replace(" "," ");
}
tick(); setInterval(tick, 20000);

/* preview buttons */
let tt;
function showPreview(){
  const el = document.getElementById("toast");
  el.classList.add("show"); clearTimeout(tt);
  tt = setTimeout(() => el.classList.remove("show"), 3500);
}


/* QR tabs */
document.getElementById("qrWrap").addEventListener("toggle", () => {
  const img = document.getElementById("qrImg");
  if (img.getAttribute("src")) return;
  const target = ME.whatsapp ? "https://wa.me/" + ME.whatsapp : location.href.split("#")[0];
  img.src = "https://api.qrserver.com/v1/create-qr-code/?size=440x440&margin=8&color=7a3a3a&data=" + encodeURIComponent(target);
  document.getElementById("qrNote").innerHTML = ME.whatsapp ? "Scan with your phone camera to chat on <b>WhatsApp</b>" : "Scan to open <b>my card</b>";
});

/* save contact (vCard) */
document.getElementById("save").addEventListener("click", () => {
  const v = ["BEGIN:VCARD","VERSION:3.0",
    "N:"+ME.last+";"+ME.first+";;;","FN:"+ME.first+" "+ME.last,
    "NICKNAME:"+ME.nick,
    ME.phone ? "TEL;TYPE=CELL:"+ME.phone : "",
    ME.email ? "EMAIL;TYPE=INTERNET:"+ME.email : "",
    "URL:"+location.href.split("#")[0],
    "END:VCARD"].filter(Boolean).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([v],{type:"text/vcard"}));
  a.download = "Ploy-Saiyud-Uamsue.vcf"; document.body.appendChild(a); a.click(); a.remove();
});

/* falling petals */
(function(){
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  const p = document.getElementById("petals"), chars = ["✿","❀","♡","✿","❁"];
  for (let i = 0; i < 14; i++){
    const e = document.createElement("span");
    e.textContent = chars[i % chars.length];
    e.style.left = (Math.random()*100) + "%";
    e.style.fontSize = (12 + Math.random()*12) + "px";
    e.style.animationDuration = (12 + Math.random()*14) + "s";
    e.style.animationDelay = (-Math.random()*20) + "s";
    p.appendChild(e);
  }
})();

/* 3D tilt on the hero card */
const hero = document.getElementById("hero");
if (matchMedia("(hover:hover) and (prefers-reduced-motion:no-preference)").matches){
  hero.addEventListener("pointermove", e => {
    const r = hero.getBoundingClientRect(), x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    hero.style.transform = "rotateX(" + ((.5 - y) * 10) + "deg) rotateY(" + ((x - .5) * 12) + "deg)";
    hero.style.setProperty("--mx", (x*100)+"%"); hero.style.setProperty("--my", (y*100)+"%");
  });
  hero.addEventListener("pointerleave", () => { hero.style.transform = ""; });
}
</script>
